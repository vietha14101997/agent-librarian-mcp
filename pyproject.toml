[build-system]
requires = ["flit_core==3.12.0"]
build-backend = "flit_core.buildapi"

[project]
name = "agent-librarian-mcp"
version = "0.8.0"
description = "Portable MCP research and owner-directed project Notebook onboarding"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Agent Librarian MCP contributors"}]
dependencies = ["mcp==2.3.0"]

[project.optional-dependencies]
personal = ["playwright==1.64.1"]

[project.scripts]
librarian = "agent_librarian.cli:main"

[tool.flit.module]
name = "agent_librarian"
