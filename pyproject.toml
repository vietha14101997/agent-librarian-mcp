[build-system]
requires = ["flit_core==3.12.0"]
build-backend = "flit_core.buildapi"

[project]
name = "agent-librarian-mcp"
version = "0.1.0"
description = "Local document catalog, disclosure-aware planning and restricted fake-provider research"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Agent Librarian MCP contributors"}]
dependencies = ["mcp==2.3.0"]

[project.scripts]
librarian = "agent_librarian.cli:main"

[tool.flit.module]
name = "agent_librarian"
